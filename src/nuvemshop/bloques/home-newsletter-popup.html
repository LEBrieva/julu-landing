<!--
  JULU · Popup "Clube JULU" (solo en la Home)
  Editor → Página inicial → agregar sección "Personalizada" → bloque "Código".
  Pegar TODO este archivo y "Salvar e publicar". La sección queda oculta por CSS.
  Reglas:
    - Aparece cuando el visitante scrolleó la mitad de la home.
    - Si lo cierra: no vuelve por 7 días.
    - Si se suscribe (acá o en el bloque naranja de la home): no vuelve nunca.
  Envía al mismo formulario de newsletter de Nuvemshop (Clientes → Mensagens).
  Estilo: src/nuvemshop/22-newsletter-popup.css
-->
<span class="julu-news-src" hidden></span>

<dialog class="julu-news" id="julu-news" aria-labelledby="julu-news-titulo">
  <button type="button" class="julu-news-x" data-news-close aria-label="Fechar">×</button>

  <div class="julu-news-step" data-step="form">
    <span class="julu-news-kicker">Clube JULU</span>
    <h2 id="julu-news-titulo">Fica sabendo <span>antes</span> de todo mundo</h2>
    <p>Coleções novas, drops e as histórias da Cleo, da Roma e do Chili direto no seu e-mail. Sem spam, palavra de gato. 🐾</p>
    <form class="julu-news-form" novalidate>
      <input type="email" name="email" placeholder="Seu e-mail" autocomplete="email" required aria-label="Seu e-mail">
      <button type="submit">Quero entrar</button>
    </form>
    <p class="julu-news-error" role="alert" hidden></p>
    <button type="button" class="julu-news-later" data-news-close>Agora não</button>
    <p class="julu-news-small">Dá pra sair quando quiser.</p>
  </div>

  <div class="julu-news-step" data-step="ok" hidden>
    <span class="julu-news-kicker">Pronto!</span>
    <h2>Bem-vindo ao <span>Clube</span> 😻</h2>
    <p>Seu e-mail tá na lista. Quando sair coleção nova, você fica sabendo primeiro.</p>
    <button type="button" class="julu-news-back" data-news-close>Voltar pra loja</button>
  </div>
</dialog>

<script>
(function(){
  var KEY='julu_news', WEEK=7*24*60*60*1000;
  function get(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
  function set(v){ try{ localStorage.setItem(KEY,v); }catch(e){} }
  function subscribed(){ set('subscribed'); }

  function ready(fn){ if(document.readyState!='loading') fn(); else document.addEventListener('DOMContentLoaded',fn); }
  ready(function(){
    var dlg=document.getElementById('julu-news');
    if(!dlg || dlg.dataset.ready) return;
    dlg.dataset.ready='1';
    document.body.appendChild(dlg);              /* sale de la sección oculta */

    /* Si se suscribe desde el bloque naranja de la home, tampoco mostramos el popup */
    var native=document.querySelector('form.newsletter-form');
    if(native) native.addEventListener('submit',subscribed);

    /* ¿Corresponde mostrarlo? */
    var st=get();
    if(st==='subscribed') return;
    if(st && /^\d+$/.test(st) && Date.now()-Number(st) < WEEK) return;

    function open(){
      window.removeEventListener('scroll',onScroll);
      if(document.querySelector('dialog[open]')) return;   /* no pisar otro popup */
      if(dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
    }
    function onScroll(){
      var max=document.documentElement.scrollHeight-window.innerHeight;
      if(max>0 && window.scrollY/max >= 0.5) open();
    }
    window.addEventListener('scroll',onScroll,{passive:true});

    function close(){
      if(dlg.dataset.done!=='1') set(String(Date.now()));   /* cerró sin suscribirse: 7 días */
      if(dlg.close) dlg.close(); else dlg.removeAttribute('open');
    }
    dlg.addEventListener('click',function(e){
      if(e.target===dlg || (e.target.closest && e.target.closest('[data-news-close]'))) close();
    });
    dlg.addEventListener('cancel',function(e){ e.preventDefault(); close(); });   /* tecla Esc */

    /* Envío: mismo formulario de newsletter de Nuvemshop */
    var form=dlg.querySelector('.julu-news-form'), err=dlg.querySelector('.julu-news-error');
    form.addEventListener('submit',function(e){
      e.preventDefault();
      var email=form.email.value.trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)){
        err.textContent='Hmm, esse e-mail não parece certo. Confere aí?'; err.hidden=false; form.email.focus(); return;
      }
      err.hidden=true;
      var btn=form.querySelector('button'); btn.disabled=true; btn.textContent='Enviando…';
      var fd=new FormData();
      fd.append('email',email); fd.append('winnie-pooh','');
      fd.append('name','Sem nome'); fd.append('message','Pedido de inscrição '); fd.append('type','newsletter');
      fd.append('contact','');
      fetch('/',{method:'POST',body:fd,credentials:'same-origin'}).then(function(r){
        if(!r.ok) throw new Error(r.status);
        dlg.dataset.done='1'; subscribed();
        dlg.querySelector('[data-step="form"]').hidden=true;
        dlg.querySelector('[data-step="ok"]').hidden=false;
      }).catch(function(){
        btn.disabled=false; btn.textContent='Quero entrar';
        err.textContent='Ops, não deu certo. Tenta de novo em um minutinho?'; err.hidden=false;
      });
    });
  });
})();
</script>
