<!--
  JULU · Popup "Clube JULU" (solo en la Home)
  Editor → Página inicial → agregar sección "Personalizada" → bloque "Código".
  Pegar TODO este archivo y "Salvar e publicar". La sección queda oculta por CSS.
  Reglas:
    - Aparece cuando el visitante scrolleó la mitad de la home.
    - Si lo cierra: no vuelve por 7 días.
    - Si se suscribe (acá o en el bloque naranja de la home): no vuelve nunca.
  Envía al mismo formulario de newsletter de Nuvemshop (Clientes → Mensagens).
  Estilo: src/nuvemshop/22-newsletter-popup.css
  Lógica: https://julu.clothing/nuvemshop/newsletter-popup.js (se actualiza con git push)
-->
<span class="julu-news-src" hidden></span>

<dialog class="julu-news" id="julu-news" aria-labelledby="julu-news-titulo">
  <button type="button" class="julu-news-x" data-news-close aria-label="Fechar">×</button>

  <div class="julu-news-step" data-step="form">
    <span class="julu-news-kicker">Clube JULU</span>
    <h2 id="julu-news-titulo">Fica sabendo <span>antes</span> de todo mundo</h2>
    <p>Coleções novas, drops e as histórias da Cleo, da Roma e do Chili direto no seu e-mail. Sem spam, palavra de gato. 🐾</p>
    <form class="julu-news-form" novalidate>
      <input type="email" name="email" placeholder="Seu e-mail" autocomplete="email" required aria-label="Seu e-mail">
      <button type="submit">Quero entrar</button>
    </form>
    <p class="julu-news-error" role="alert" hidden></p>
    <button type="button" class="julu-news-later" data-news-close>Agora não</button>
    <p class="julu-news-small">Dá pra sair quando quiser.</p>
  </div>

  <div class="julu-news-step" data-step="ok" hidden>
    <span class="julu-news-kicker">Pronto!</span>
    <h2>Bem-vindo ao <span>Clube</span> 😻</h2>
    <p>Seu e-mail tá na lista. Quando sair coleção nova, você fica sabendo primeiro.</p>
    <button type="button" class="julu-news-back" data-news-close>Voltar pra loja</button>
  </div>
</dialog>

<script src="https://julu.clothing/nuvemshop/newsletter-popup.js" defer></script>
